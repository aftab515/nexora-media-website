name: One-time dependency remediation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation.yml'
permissions:
  contents: write
jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'improvements/website-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Upgrade vulnerable development tools
        run: |
          npm install --save-dev 'eslint@^9' 'typescript-eslint@^8'
          npm update
          npm audit fix || true
      - name: Verify dependency security
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Verify website functionality
        run: |
          npm run typecheck
          npm run lint
          node --experimental-strip-types --test tests/growth-planner.test.mjs
          npm run build
      - name: Commit verified development-tool upgrades
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update vulnerable development dependencies"
            git push origin HEAD:refs/heads/improvements/website-audit
          fi
