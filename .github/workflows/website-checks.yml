name: Website checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/growth-planner.test.mjs
      - run: npm run build
      - name: Verify Nexora branding and absence of Bolt attribution
        run: node --test tests/branding.test.mjs
      - name: Full dependency audit
        run: npm audit --audit-level=moderate
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/nexora-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: verified-website-build
          path: dist/
  source_release:
    name: Publish versioned source pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-website-build
          path: dist/
      - name: Archive verified website build
        run: tar -czf nexora-media-website-v0.1.0-build.tar.gz -C dist .
      - name: Publish v0.1.0 pre-release only once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; no duplicate release will be created."
          else
            gh release create v0.1.0 nexora-media-website-v0.1.0-build.tar.gz \
              --target "$GITHUB_SHA" \
              --title "Nexora Media website v0.1.0 (source preview)" \
              --notes-file docs/RELEASE_NOTES_v0.1.0.md \
              --prerelease
          fi
